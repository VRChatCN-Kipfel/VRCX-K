[package]
name = "hands-e2e"
version = "0.1.0"
edition = "2021"

# Empty [workspace] opts this crate OUT of the VRCX-K root workspace, so building
# the probe can never touch the real Cargo.lock or the src-tauri build. The
# production sources are pulled in with `#[path]` instead (see src/main.rs).
[workspace]

# Dependencies mirror `src-tauri/Cargo.toml` for the modules under test. They MUST
# stay in step with it: the probe compiles the real files, so a missing dependency
# here is a compile error rather than a silent divergence.
[dependencies]
serde_json = "1"
base64 = "0.22"
notify = "8"
file-id = "0.2"

[[bin]]
name = "hands-e2e"
path = "src/main.rs"

[profile.release]
opt-level = 2
