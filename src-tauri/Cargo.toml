[package]
name = "tauri-app"
version = "0.1.0"
description = "VRCX-K shell — Tauri 2 / Rust system proxy (hands). See docs/architecture-proposal.md"
authors = ["VRCX-K"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
# Cross-platform notifications (desktop win/mac/linux + android/ios under one API).
# Shell exposes simple notify via this plugin; Windows-deep (buttons/hero) rides
# tauri-winrt-notification below (added at F3; dependency already provisioned).
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
typify = { version = "0.7.0", features = ["macro"] }
# Runtime support emitted by typify for schema regex constraints.
regress = "0.11.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows-deep toast (AUMID/icon/hero/buttons) — tauri-apps official fork of
# winrt-notification. Provisioned now so F3 depth lands without touching the
# shell's notification layer; actually used from F3 onward.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
